{
  "openapi": "3.1.0",
  "info": {
    "title": "OmniPanel v2 candidate agent contract",
    "version": "2.0.0-draft.1",
    "description": "Unimplemented initial proposal, pending lab and security contract freeze. Not the legacy bearer-token API. This fragment covers structural desired/report only; enrollment, membership, accounting and recovery contracts remain pending."
  },
  "servers": [
    {
      "url": "https://agent-gateway.omnipanel.invalid",
      "description": "Placeholder origin only; not deployed."
    }
  ],
  "security": [
    {
      "nodeMTLS": []
    }
  ],
  "paths": {
    "/v2/nodes/self/desired": {
      "get": {
        "operationId": "getNodeDesired",
        "summary": "Poll node-scoped signed structural state",
        "description": "Identity is derived exclusively from verified end-to-end client certificate and revocation checks, never forwarded headers. Wrong/unapproved epoch returns recovery-required conflict; no automatic lower-revision recovery. A membership cursor does not provide a signed membership stream.",
        "parameters": [
          {
            "name": "controlPlaneEpoch",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "structuralSequence",
            "in": "query",
            "required": true,
            "schema": {
              "type": "integer",
              "minimum": 0,
              "maximum": 9007199254740991
            }
          },
          {
            "name": "membershipSequence",
            "in": "query",
            "required": true,
            "schema": {
              "type": "integer",
              "minimum": 0,
              "maximum": 9007199254740991
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Signed structural desired state. Schema validity alone is not authorization.",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "const": "private, no-store"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./desired-state.schema.json"
                }
              }
            }
          },
          "204": {
            "description": "No structural change for the supplied epoch/cursor; no assertion about membership convergence."
          },
          "400": {
            "description": "RFC 9457 problem; no secret values or bearer tokens in detail/instance.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "401": {
            "description": "RFC 9457 problem; no secret values or bearer tokens in detail/instance.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "403": {
            "description": "RFC 9457 problem; no secret values or bearer tokens in detail/instance.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "409": {
            "description": "RFC 9457 problem; no secret values or bearer tokens in detail/instance.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "429": {
            "description": "RFC 9457 problem; no secret values or bearer tokens in detail/instance.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "503": {
            "description": "RFC 9457 problem; no secret values or bearer tokens in detail/instance.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        }
      }
    },
    "/v2/nodes/self/reports": {
      "post": {
        "operationId": "reportNodeObserved",
        "summary": "Report component-specific structural and membership cursors",
        "description": "Scopes the report to the authenticated node. Claimed VERIFIED status is not a substitute for independent L2/L3 evidence. Reported cursors never mutate immutable desired revisions.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ObservedReport"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Report durably accepted; desired state is unchanged."
          },
          "400": {
            "description": "RFC 9457 problem; no secret values or bearer tokens in detail/instance.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "401": {
            "description": "RFC 9457 problem; no secret values or bearer tokens in detail/instance.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "403": {
            "description": "RFC 9457 problem; no secret values or bearer tokens in detail/instance.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "409": {
            "description": "RFC 9457 problem; no secret values or bearer tokens in detail/instance.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "429": {
            "description": "RFC 9457 problem; no secret values or bearer tokens in detail/instance.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "503": {
            "description": "RFC 9457 problem; no secret values or bearer tokens in detail/instance.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        }
      }
    },
    "/v2/nodes/enroll": {
      "post": {
        "operationId": "enrollNodeCertificate",
        "summary": "Redeem a pre-authorized single-use token with a signed CSR",
        "description": "Library-only bootstrap endpoint contract, NOT deployed. TLS 1.3 is mandatory; the caller has no client certificate yet. Identity is derived only from the server-side token grant, never CSR fields, query parameters or forwarded headers. Requires a shared fail-closed admission limiter and independently protected issuer key. Does not issue enrollment grants, renew certificates, or apply runtime configurations.",
        "security": [
          {
            "enrollmentBearer": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "csrPem"
                ],
                "properties": {
                  "csrPem": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 16384,
                    "description": "PEM encoded CSR with Ed25519 or P-256 proof-of-possession."
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Certificate committed to the durable ledger; not evidence of agent enrollment completion.",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "const": "private, no-store"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EnrollmentIssued"
                }
              }
            }
          },
          "400": {
            "description": "RFC 9457 bootstrap problem; never echoes token, CSR, signer or database details.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/EnrollmentProblem"
                }
              }
            }
          },
          "401": {
            "description": "RFC 9457 bootstrap problem; never echoes token, CSR, signer or database details.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/EnrollmentProblem"
                }
              }
            }
          },
          "403": {
            "description": "RFC 9457 bootstrap problem; never echoes token, CSR, signer or database details.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/EnrollmentProblem"
                }
              }
            }
          },
          "404": {
            "description": "RFC 9457 bootstrap problem; never echoes token, CSR, signer or database details.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/EnrollmentProblem"
                }
              }
            }
          },
          "405": {
            "description": "RFC 9457 bootstrap problem; never echoes token, CSR, signer or database details.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/EnrollmentProblem"
                }
              }
            }
          },
          "413": {
            "description": "RFC 9457 bootstrap problem; never echoes token, CSR, signer or database details.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/EnrollmentProblem"
                }
              }
            }
          },
          "415": {
            "description": "RFC 9457 bootstrap problem; never echoes token, CSR, signer or database details.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/EnrollmentProblem"
                }
              }
            }
          },
          "429": {
            "description": "RFC 9457 bootstrap problem; never echoes token, CSR, signer or database details.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/EnrollmentProblem"
                }
              }
            }
          },
          "503": {
            "description": "RFC 9457 bootstrap problem; never echoes token, CSR, signer or database details.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/EnrollmentProblem"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "nodeMTLS": {
        "type": "mutualTLS",
        "description": "Private PKI with node-scoped identity, certificate renewal and explicit revocation checks."
      },
      "enrollmentBearer": {
        "type": "http",
        "scheme": "bearer",
        "description": "Single-use 256-bit enrollment bearer (15-minute maximum grant lifetime), sent only over direct TLS 1.3. The trusted administrator must create this grant out-of-band; CSR identity claims do not authorize nodes."
      }
    },
    "schemas": {
      "Problem": {
        "type": "object",
        "required": [
          "type",
          "title",
          "status",
          "correlationId"
        ],
        "properties": {
          "type": {
            "type": "string",
            "format": "uri-reference"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "integer",
            "minimum": 400,
            "maximum": 599
          },
          "detail": {
            "type": "string"
          },
          "instance": {
            "type": "string",
            "format": "uri-reference"
          },
          "correlationId": {
            "type": "string",
            "format": "uuid"
          }
        }
      },
      "ObservedReport": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schemaVersion",
          "controlPlaneEpoch",
          "structuralSequence",
          "membershipSequence",
          "components"
        ],
        "properties": {
          "schemaVersion": {
            "const": "2.0"
          },
          "controlPlaneEpoch": {
            "type": "string",
            "format": "uuid"
          },
          "structuralSequence": {
            "type": "integer",
            "minimum": 0,
            "maximum": 9007199254740991
          },
          "membershipSequence": {
            "type": "integer",
            "minimum": 0,
            "maximum": 9007199254740991
          },
          "components": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "id",
                "state",
                "activeConfigurationDigest",
                "processGeneration"
              ],
              "properties": {
                "id": {
                  "type": "string",
                  "pattern": "^[a-z][a-z0-9_-]{0,63}$"
                },
                "state": {
                  "enum": [
                    "RECEIVED",
                    "SIGNATURE_VERIFIED",
                    "VALIDATED",
                    "STAGED",
                    "PREFLIGHTED",
                    "APPLYING",
                    "APPLIED_UNVERIFIED",
                    "VERIFIED",
                    "FAILED",
                    "ROLLING_BACK",
                    "ROLLED_BACK",
                    "DEGRADED_REQUIRES_OPERATOR"
                  ]
                },
                "activeConfigurationDigest": {
                  "type": [
                    "string",
                    "null"
                  ],
                  "pattern": "^[a-f0-9]{64}$"
                },
                "processGeneration": {
                  "type": [
                    "string",
                    "null"
                  ],
                  "format": "uuid"
                }
              }
            }
          }
        }
      },
      "EnrollmentProblem": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "type",
          "title",
          "status"
        ],
        "properties": {
          "type": {
            "const": "about:blank"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "integer",
            "minimum": 400,
            "maximum": 599
          }
        }
      },
      "EnrollmentIssued": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "nodeId",
          "certificatePem",
          "serial",
          "expiresAt"
        ],
        "properties": {
          "nodeId": {
            "type": "string",
            "format": "uuid"
          },
          "certificatePem": {
            "type": "string",
            "description": "PEM-encoded client-only X.509 certificate; private key never leaves the caller."
          },
          "serial": {
            "type": "string"
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      }
    }
  }
}
