name: Foundation verification (not production qualification)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: make check-contracts test-contracts test-provenance
      - run: npm run typecheck
      - run: npm run lint
      # Real gate-lab requires protected external networking evidence.
      # Passing this workflow is deliberately not an M0/M1/M2 release gate.

  signed-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - run: make test-go
      - run: test -z "$(gofmt -l internal/manifest/*.go internal/agent/sessions/*.go internal/drivers/*.go)"
      # A valid signature is not evidence of an applied node configuration.
