name: Foundation verification (not production qualification)
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: make check-contracts test-contracts test-provenance
      - run: npm run typecheck
      - run: npm run lint
      # Real gate-lab requires protected external networking evidence.
      # Passing this workflow is deliberately not an M0/M1/M2 release gate.

  signed-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Require gofmt for manifest, drivers, agent and enrollment APIs
        run: |
          unformatted="$(gofmt -l internal/manifest/*.go internal/drivers/*.go internal/drivers/singbox/*.go internal/agent/state/*.go internal/agent/reconcile/*.go internal/agent/gateway/*.go internal/agent/gateway/desiredapi/*.go internal/agent/metering/*.go internal/agent/syncfeed/*.go internal/backup/*.go internal/observability/*.go internal/pki/enrollment/*.go internal/pki/enrollment/httpapi/*.go internal/pki/enrollment/grants/*.go)"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go source:\n%s\n' "$unformatted" >&2
            # Print the exact formatting delta without modifying the workspace.
            gofmt -d internal/agent/state/*.go internal/agent/reconcile/*.go internal/agent/gateway/*.go internal/agent/gateway/desiredapi/*.go internal/agent/metering/*.go internal/agent/syncfeed/*.go internal/backup/*.go internal/observability/*.go internal/pki/enrollment/*.go internal/pki/enrollment/httpapi/*.go internal/pki/enrollment/grants/*.go >&2
            exit 1
          fi
      - run: make test-go
      # The pre-existing agent/session registry is covered by the full Go
      # tests; formatting that older package is a separate cleanup change.
      # A valid signature is not evidence of an applied node configuration.
