name: Local Sing-box runtime smoke (not M0 acceptance)

on:
  workflow_dispatch:
  push:
    paths:
      - "lab/runtime/**"
      - "internal/drivers/singbox/native*.go"
      - "internal/agent/supervisorserver/**"
      - "internal/agent/supervisoripc/real_host_test.go"
      - "Makefile"
      - "README.md"
      - "lab/README.md"
      - "docs/implementation/status.md"
      - ".github/workflows/runtime-smoke.yml"
  pull_request:
    paths:
      - "lab/runtime/**"
      - "internal/drivers/singbox/native*.go"
      - "internal/agent/supervisorserver/**"
      - "internal/agent/supervisoripc/real_host_test.go"
      - "Makefile"
      - "README.md"
      - "lab/README.md"
      - "docs/implementation/status.md"
      - ".github/workflows/runtime-smoke.yml"

# Superseded commits must not occupy scarce signed-runtime lab runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reality-runtime:
    # Fork PRs cannot mint a trusted repository workflow identity. Skip this
    # signing job for forks; the non-signing contract workflow still runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Build, sign and exercise Reality/Vision locally
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      SING_BOX_BIN: ${{ github.workspace }}/.data/lab-runtime/sing-box
      SING_BOX_METADATA: ${{ github.workspace }}/.data/lab-runtime/build-metadata.json
      SING_BOX_BUNDLE: ${{ github.workspace }}/.data/lab-runtime/provenance/sing-box.sigstore.json
      SING_BOX_METADATA_BUNDLE: ${{ github.workspace }}/.data/lab-runtime/provenance/build-metadata.sigstore.json
      EVIDENCE_DIR: ${{ github.workspace }}/.data/lab-runtime/evidence
    steps:
      - name: Check out OmniPanel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: false

      - name: Install Linux lab tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 openssl jq python3

      - name: Check lab and provenance scripts
        run: |
          bash -n lab/runtime/build-sing-box.sh
          bash -n lab/runtime/run-local-reality.sh
          bash -n lab/runtime/verify-provenance.sh
          bash -n lab/runtime/verify-provenance_test.sh
          bash lab/runtime/verify-provenance_test.sh
          python3 - <<'PY'
          from pathlib import Path

          for source in ("lab/runtime/echo_server.py", "lab/runtime/socks5_probe.py"):
              compile(Path(source).read_text(encoding="utf-8"), source, "exec")
          PY

      - name: Build Sing-box with the required statistics API
        run: bash lab/runtime/build-sing-box.sh

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@b9c35392b7c1401bcc77d30c9b07cf4b1c7a7b07 # pinned installer commit
        with:
          cosign-release: v3.1.4

      - name: Verify Cosign tool version
        run: cosign version | grep -F "v3.1.4"

      # Rekor v1 has intermittently rejected new entries with HTTP 500.
      # Select Rekor v2 through Sigstore's authenticated TUF service metadata:
      # never hardcode a log shard, trust key or unauthenticated endpoint.
      - name: Resolve trusted public Rekor v2 signing services
        run: |
          cosign signing-config create \
            --with-default-rekor-v2 \
            --out "$RUNNER_TEMP/omnipanel-sigstore-v2.json"
          test -s "$RUNNER_TEMP/omnipanel-sigstore-v2.json"

      - name: Sign runtime binary and build metadata with Sigstore
        run: |
          mkdir -p "$(dirname "$SING_BOX_BUNDLE")"
          # Rekor may return transient HTTP 5xx; retry signing, never skip verification.
          sign_with_retry() {
            local subject="$1" bundle="$2" attempt
            for attempt in 1 2 3 4; do
              if cosign sign-blob --yes \
                --signing-config "$RUNNER_TEMP/omnipanel-sigstore-v2.json" \
                --bundle "$bundle" "$subject"; then
                return 0
              fi
              if [ "$attempt" -eq 4 ]; then
                echo "FAIL: Sigstore signing unavailable after 4 attempts: $subject" >&2
                return 1
              fi
              sleep "$((attempt * 5))"
            done
          }
          sign_with_retry "$SING_BOX_BIN" "$SING_BOX_BUNDLE"
          sign_with_retry "$SING_BOX_METADATA" "$SING_BOX_METADATA_BUNDLE"

      - name: Verify signatures, signer identity and build metadata
        id: verify-provenance
        run: |
          bash lab/runtime/verify-provenance.sh \
            "$SING_BOX_BIN" \
            "$SING_BOX_METADATA" \
            "$SING_BOX_BUNDLE" \
            "$SING_BOX_METADATA_BUNDLE"

      # Check the same exact binary only after its Sigstore proof has passed.
      # This deny-all candidate does not imply a live or M0-qualified apply.
      - name: Native Sing-box pinned-binary preflight and private staging
        run: |
          OMNI_NATIVE_TEST_SING_BOX_BIN="$SING_BOX_BIN" \
            go test -count=1 -run '^TestPinnedSingBoxBinaryNativePreflight$' ./internal/drivers/singbox

      # Reuses the Sigstore-verified exact binary. The ephemeral hosted runner
      # must have systemd and passwordless sudo; cleanup removes the fixed unit.
      # This is root-host evidence, NOT a public VPS or M0 release gate.
      - name: Exercise real root supervisor, systemd and Sing-box after SIGKILL
        run: |
          bash -n lab/runtime/run-root-supervisor-host-smoke.sh
          go build -o "$RUNNER_TEMP/omnipanel-supervisor" ./cmd/omnipanel-supervisor
          sudo env \
            "PATH=$PATH" \
            "GITHUB_ACTIONS=true" \
            "OMNI_ALLOW_EPHEMERAL_ROOT_SMOKE=1" \
            "SING_BOX_BIN=$SING_BOX_BIN" \
            "ROOT_SUPERVISOR_BIN=$RUNNER_TEMP/omnipanel-supervisor" \
            "EVIDENCE_DIR=$EVIDENCE_DIR" \
            bash lab/runtime/run-root-supervisor-host-smoke.sh

      - name: Record sanitized root rollback evidence
        if: always()
        run: |
          if [ -s "$EVIDENCE_DIR/root-supervisor-host-smoke.json" ]; then
            cat "$EVIDENCE_DIR/root-supervisor-host-smoke.json" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain signed runtime and Sigstore verification bundles
        if: steps.verify-provenance.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sing-box-1.14.4-omni-provenance-${{ github.run_id }}
          path: |
            .data/lab-runtime/sing-box
            .data/lab-runtime/build-metadata.json
            .data/lab-runtime/provenance/sing-box.sigstore.json
            .data/lab-runtime/provenance/build-metadata.sigstore.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
          compression-level: 0

      - name: Install pinned gRPC statistics client
        run: |
          go install github.com/fullstorydev/grpcurl/cmd/grpcurl@v1.9.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run the isolated Reality/Vision and accounting test
        run: |
          sudo env \
            "PATH=$PATH" \
            "SING_BOX_BIN=$SING_BOX_BIN" \
            "SING_BOX_METADATA=$SING_BOX_METADATA" \
            "EVIDENCE_DIR=$EVIDENCE_DIR" \
            make test-runtime

      - name: Publish sanitized smoke report
        if: always()
        run: |
          if [ -s "$EVIDENCE_DIR/local-reality-smoke.json" ]; then
            cat "$EVIDENCE_DIR/local-reality-smoke.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No runtime report was produced; inspect the failed step logs." >> "$GITHUB_STEP_SUMMARY"
          fi
