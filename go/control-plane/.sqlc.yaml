version: "2"
sql:
  - schema: "../../db/migrations/0001_initial.sql"
    queries: ""
    engine: "postgresql"
    gen:
      go:
        package: "store"
        out: "internal/store"
        emit_db_tags: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_pointers_for_nullable_text: false
        emit_result_struct_pointers: false
        emit_methods_with_argument_name: false
        emit_interface_method_examples: false
        emit_prepared_queries: false
        emit_all_enum_values: false
        emit_exact_column_names: false
        json_tags_case_insensitive: false
        output_file_name: "models.go"
        output_file_path: ""
        emit_after: []
        emit_before: []
        emit_package: ""
        overrides: {}
