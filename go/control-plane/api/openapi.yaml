openapi: 3.0.3
info:
  title: OmniPanel Control Plane API
  version: "2.0.0"
  description: |
    OmniPanel v2.0 control plane API. Go-based backend serving the React frontend
    and agent nodes. Endpoints cover identity, plans/users, infrastructure,
    revisions & deployment, accounting, health & alerts, and M2 integrations
    (Xray, CDN, relay, WARP, BPB).
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.omnipanel.example.com
    description: Production
tags:
  - name: identity
    description: Admin authentication, sessions, TOTP
  - name: plans
    description: Subscription plans and quotas
  - name: users
    description: User management and subscription tokens
  - name: infrastructure
    description: Nodes, inbounds, endpoint principals
  - name: revisions
    description: Structural revisions, membership, deployment
  - name: accounting
    description: Metering, usage aggregates, capability evidence
  - name: health
    description: Health observations, inbound health, alerts
  - name: outbox
    description: Outbox job management
  - name: m2
    description: M2 integrated platform (Xray, CDN, relay, WARP, BPB)
paths:
  # ---------- Identity ----------
  /v1/setup:
    post:
      tags: [identity]
      summary: Bootstrap first admin account
      operationId: setupAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '200':
          description: Admin created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupResponse'
        '422':
          description: Setup already completed

  /v1/auth/login:
    post:
      tags: [identity]
      summary: Admin login
      operationId: loginAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session cookie issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials

  /v1/auth/logout:
    post:
      tags: [identity]
      summary: Admin logout (clear session cookie)
      operationId: logoutAdmin
      responses:
        '200':
          description: Session cleared

  /v1/auth/totp/enable:
    post:
      tags: [identity]
      summary: Enable TOTP for admin
      operationId: enableTotp
      security:
        - sessionAuth: []
      responses:
        '200':
          description: TOTP secret and QR code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpResponse'

  /v1/auth/totp/verify:
    post:
      tags: [identity]
      summary: Verify and activate TOTP
      operationId: verifyTotp
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpVerifyRequest'
      responses:
        '200':
          description: TOTP activated

  # ---------- Plans ----------
  /v1/plans:
    get:
      tags: [plans]
      summary: List plans
      operationId: listPlans
      security:
        - sessionAuth: []
      responses:
        '200':
          description: List of plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
    post:
      tags: [plans]
      summary: Create plan
      operationId: createPlan
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
      responses:
        '200':
          description: Plan created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '409':
          description: Plan name already exists
        '422':
          description: Idempotency key conflict

  /v1/plans/{id}:
    get:
      tags: [plans]
      summary: Get plan by ID
      operationId: getPlan
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: Plan details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '404':
          description: Plan not found

  # ---------- Users ----------
  /v1/users:
    get:
      tags: [users]
      summary: List users
      operationId: listUsers
      security:
        - sessionAuth: []
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags: [users]
      summary: Create user
      operationId: createUser
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: User created with subscription token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          description: Idempotency key conflict
        '422':
          description: Validation error

  /v1/users/{id}:
    get:
      tags: [users]
      summary: Get user by ID
      operationId: getUser
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
    patch:
      tags: [users]
      summary: Update user status
      operationId: updateUserStatus
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /v1/users/{id}/suspend:
    post:
      tags: [users]
      summary: Suspend user
      operationId: suspendUser
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /v1/users/{id}/resume:
    post:
      tags: [users]
      summary: Resume user
      operationId: resumeUser
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /v1/users/me/usage:
    get:
      tags: [users]
      summary: Get current user's usage
      operationId: getMyUsage
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Usage summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummary'

  # ---------- Subscription ----------
  /sub/{token}:
    get:
      tags: [users]
      summary: Get subscription configuration (agent-facing)
      operationId: getSubscription
      parameters:
        - $ref: '#/components/parameters/SubscriptionToken'
        - in: query
          name: format
          schema:
            type: string
            enum: [singbox, mihomo, uri]
            default: singbox
      responses:
        '200':
          description: Subscription configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
            text/plain:
              schema:
                type: string
        '404':
          description: Token not found or revoked

  # ---------- Infrastructure ----------
  /v1/infrastructure/nodes:
    get:
      tags: [infrastructure]
      summary: List nodes
      operationId: listNodes
      security:
        - sessionAuth: []
      responses:
        '200':
          description: List of nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Node'
    post:
      tags: [infrastructure]
      summary: Create node (issue enrollment token)
      operationId: createNode
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNodeRequest'
      responses:
        '200':
          description: Node created with enrollment token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResponse'

  /v1/infrastructure/nodes/{id}:
    get:
      tags: [infrastructure]
      summary: Get node by ID
      operationId: getNode
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: Node details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '404':
          description: Node not found

  /v1/infrastructure/nodes/{id}/address:
    put:
      tags: [infrastructure]
      summary: Update node public address
      operationId: updateNodeAddress
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNodeAddressRequest'
      responses:
        '200':
          description: Address updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '422':
          description: Invalid address (e.g. loopback)

  /v1/infrastructure/nodes/{id}/quarantine:
    post:
      tags: [infrastructure]
      summary: Quarantine node (revoke identity)
      operationId: quarantineNode
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: Node quarantined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuarantineResponse'

  /v1/infrastructure/nodes/{id}/inbounds:
    post:
      tags: [infrastructure]
      summary: Create inbound on node
      operationId: createInbound
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInboundRequest'
      responses:
        '200':
          description: Inbound created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inbound'
        '409':
          description: Listener conflict (node + transport + port)

  /v1/infrastructure/inbounds/{id}/enable:
    put:
      tags: [infrastructure]
      summary: Enable/disable inbound
      operationId: setInboundEnabled
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/InboundId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetInboundEnabledRequest'
      responses:
        '200':
          description: Inbound updated

  /v1/infrastructure/nodes/{id}/rotate-secrets:
    post:
      tags: [infrastructure]
      summary: Rotate node secrets
      operationId: rotateNodeSecrets
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: Secrets rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateSecretsResponse'

  # ---------- Agent protocol ----------
  /v1/agent/enroll:
    post:
      tags: [infrastructure]
      summary: Agent enrollment (single-use token -> credentials)
      operationId: enrollAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollRequest'
      responses:
        '200':
          description: Agent credentials issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollResponse'
        '401':
          description: Invalid or expired token

  /v1/agent/desired:
    get:
      tags: [infrastructure]
      summary: Agent desired state (structural + membership)
      operationId: getDesiredState
      parameters:
        - in: query
          name: epoch
          schema:
            type: integer
        - in: query
          name: structural
          schema:
            type: integer
        - in: query
          name: membership
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Signed desired state response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesiredResponse'
        '401':
          description: Unauthorized agent

  /v1/agent/report:
    post:
      tags: [infrastructure]
      summary: Agent deployment report
      operationId: agentReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentReportRequest'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Report accepted

  /v1/agent/metering:
    post:
      tags: [accounting]
      summary: Agent metering report
      operationId: agentMetering
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeteringReportRequest'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Metering accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeteringSummary'

  # ---------- Revisions ----------
  /v1/revisions/structural:
    post:
      tags: [revisions]
      summary: Publish structural revision
      operationId: publishStructural
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishStructuralRequest'
      responses:
        '200':
          description: Revision published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuralRevision'
        '204':
          description: No change (no-op)

  /v1/revisions/rollback:
    post:
      tags: [revisions]
      summary: Rollback to previous structural revision
      operationId: rollbackStructural
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackRequest'
      responses:
        '200':
          description: Rollback revision created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuralRevision'

  /v1/revisions/recovery-epoch:
    post:
      tags: [revisions]
      summary: Declare recovery epoch (cross-epoch snapshot)
      operationId: declareRecoveryEpoch
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryEpochRequest'
      responses:
        '200':
          description: New epoch declared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryEpochResponse'

  # ---------- Accounting ----------
  /v1/accounting/usage/{userId}:
    get:
      tags: [accounting]
      summary: Get user usage aggregate
      operationId: getUsage
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Usage aggregate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageAggregate'

  /v1/accounting/capability-evidence:
    get:
      tags: [accounting]
      summary: List capability evidence
      operationId: listCapabilityEvidence
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Capability evidence list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CapabilityEvidence'

  # ---------- Health ----------
  /v1/health/observations:
    post:
      tags: [health]
      summary: Record health observation (agent-facing)
      operationId: recordHealthObservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthObservationRequest'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Observation recorded

  /v1/health/inbounds/{id}:
    get:
      tags: [health]
      summary: Get inbound health state
      operationId: getInboundHealth
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/InboundId'
      responses:
        '200':
          description: Inbound health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundHealth'

  /v1/health/alerts:
    get:
      tags: [health]
      summary: List alerts
      operationId: listAlerts
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Alert list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'

  # ---------- Outbox ----------
  /v1/outbox/jobs:
    get:
      tags: [outbox]
      summary: List outbox jobs
      operationId: listOutboxJobs
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Outbox jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OutboxJob'

  # ---------- M2: Integrated Platform ----------
  /v1/m2/xray/config/{nodeId}:
    get:
      tags: [m2]
      summary: Generate Xray configuration for node
      operationId: getXrayConfig
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: Xray JSON config
          content:
            application/json:
              schema:
                type: object

  /v1/m2/cdn/providers:
    get:
      tags: [m2]
      summary: List available CDN providers
      operationId: listCdnProviders
      security:
        - sessionAuth: []
      responses:
        '200':
          description: CDN providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CdnProvider'

  /v1/m2/cdn/mapping:
    post:
      tags: [m2]
      summary: Create CDN domain mapping
      operationId: createCdnMapping
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCdnMappingRequest'
      responses:
        '200':
          description: CDN mapping created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CdnMapping'

  /v1/m2/relay/nodes:
    get:
      tags: [m2]
      summary: List relay nodes
      operationId: listRelayNodes
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Relay nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RelayNode'

  /v1/m2/relay/tunnel:
    post:
      tags: [m2]
      summary: Create relay tunnel
      operationId: createRelayTunnel
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRelayTunnelRequest'
      responses:
        '200':
          description: Relay tunnel created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayTunnel'

  /v1/m2/warp/peers:
    get:
      tags: [m2]
      summary: List WARP peers
      operationId: listWarpPeers
      security:
        - sessionAuth: []
      responses:
        '200':
          description: WARP peers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WarpPeer'

  /v1/m2/warp/configure:
    post:
      tags: [m2]
      summary: Configure WARP interface
      operationId: configureWarp
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureWarpRequest'
      responses:
        '200':
          description: WARP configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarpInterface'

  /v1/m2/bpb/policy:
    get:
      tags: [m2]
      summary: Get BPB (Bandwidth Policy Bridge) policy
      operationId: getBpbPolicy
      security:
        - sessionAuth: []
      responses:
        '200':
          description: BPB policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BpbPolicy'

  /v1/m2/bpb/policy:
    post:
      tags: [m2]
      summary: Update BPB policy
      operationId: updateBpbPolicy
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BpbPolicy'
      responses:
        '200':
          description: BPB policy updated

  # ---------- Components ----------
  components:
    schemas:
      SetupRequest:
        type: object
        required: [email, password, setupToken]
        properties:
          email:
            type: string
            format: email
          password:
            type: string
            minLength: 8
          setupToken:
            type: string
      SetupResponse:
        type: object
        properties:
          adminId:
            type: integer
          email:
            type: string

      LoginRequest:
        type: object
        required: [email, password]
        properties:
          email:
            type: string
          password:
            type: string

      LoginResponse:
        type: object
        properties:
          adminId:
            type: integer
          role:
            type: string

      TotpResponse:
        type: object
        properties:
          secret:
            type: string
          qrCode:
            type: string

      TotpVerifyRequest:
        type: object
        required: [code]
        properties:
          code:
            type: string

      Plan:
        type: object
        properties:
          id:
            type: integer
          name:
            type: string
          quotaBytes:
            type: integer
            format: int64
          enforcement:
            type: string
          createdAt:
            type: string
            format: date-time

      CreatePlanRequest:
        type: object
        required: [name, idemKey]
        properties:
          name:
            type: string
          quotaGb:
            type: number
          enforcement:
            type: string
            enum: [hard, metered, unmetered]
          idemKey:
            type: string

      User:
        type: object
        properties:
          id:
            type: integer
          name:
            type: string
          email:
            type: string
          planId:
            type: integer
          status:
            type: string
          suspendReason:
            type: string
          expiresAt:
            type: string
            format: date-time
          version:
            type: integer

      CreateUserRequest:
        type: object
        required: [name, planId, idemKey]
        properties:
          name:
            type: string
          email:
            type: string
          planId:
            type: integer
          idemKey:
            type: string

      UserResponse:
        type: object
        properties:
          userId:
            type: integer
          token:
            type: string

      UpdateUserStatusRequest:
        type: object
        required: [status]
        properties:
          status:
            type: string
            enum: [active, suspended, expired]
          reason:
            type: string

      UsageSummary:
        type: object
        properties:
          totalUp:
            type: integer
            format: int64
          totalDown:
            type: integer
            format: int64
          suspended:
            type: boolean

      SubscriptionResponse:
        type: object
        properties:
          format:
            type: string
          config:
            type: string

      Node:
        type: object
        properties:
          id:
            type: integer
          name:
            type: string
          publicAddress:
            type: string
          provider:
            type: string
          asn:
            type: string
          region:
            type: string
          status:
            type: string
          agentVersion:
            type: string
          lastSeenAt:
            type: string
            format: date-time

      NodeResponse:
        type: object
        properties:
          nodeId:
            type: integer
          token:
            type: string

      CreateNodeRequest:
        type: object
        required: [name, address, provider]
        properties:
          name:
            type: string
          address:
            type: string
          provider:
            type: string
          asn:
            type: string
          region:
            type: string

      UpdateNodeAddressRequest:
        type: object
